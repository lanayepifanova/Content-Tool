<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basis Point</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="home-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="/">
          <span>Basis Point</span>
        </a>
        <div class="nav-actions">
          <button class="menu-button" type="button" aria-label="Menu">
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>

      <section class="hero">
        <div id="chatIntro" class="intro-copy">
          <h1>Find today’s Reel topic</h1>
        </div>

        <div id="chatThread" class="chat-thread" aria-live="polite"></div>

        <section class="prompt-card" aria-label="Prompt composer">
          <textarea
            id="promptInput"
            rows="2"
            placeholder="Ask Basis Point to find a Reel topic about AI, markets, startups..."
          ></textarea>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
