<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basis Point</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="home-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="/">
          <span>Basis Point</span>
        </a>
        <div class="nav-actions">
          <button id="menuButton" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>

      <aside id="choiceDrawer" class="choice-drawer" aria-label="Navigation choices" aria-hidden="true">
        <div class="drawer-head">
          <span>Choices</span>
          <button id="closeDrawerButton" type="button" aria-label="Close menu">Close</button>
        </div>
        <div class="drawer-list">
          <button class="drawer-choice" type="button" data-choice="instagram-tiktok">Instagram &amp; Tiktok</button>
          <button class="drawer-choice" type="button" data-choice="youtube">Youtube Channel</button>
          <button class="drawer-choice" type="button" data-choice="uilg-format">UILG Format Videos</button>
        </div>
      </aside>
      <div id="drawerScrim" class="drawer-scrim"></div>

      <section class="hero">
        <div id="chatIntro" class="intro-copy">
          <h1>Find today’s Reel topic</h1>
        </div>

        <div id="chatThread" class="chat-thread" aria-live="polite"></div>

        <section class="prompt-card" aria-label="Prompt composer">
          <textarea
            id="promptInput"
            rows="2"
            placeholder="Ask Basis Point to find a Reel topic about AI, markets, startups..."
          ></textarea>
        </section>
      </section>

      <section id="uilgPanel" class="uilg-panel" aria-label="UILG context trainer">
        <div class="uilg-copy">
          <span>UILG</span>
          <h2>Train the content intelligence layer</h2>
          <p>Add your context database here: formats, hooks, retention notes, creator voice, teardown notes, and rules for what performs.</p>
        </div>

        <form id="uilgForm" class="uilg-card">
          <label>
            Dataset label
            <input id="uilgLabel" type="text" placeholder="High-performing reels playbook">
          </label>
          <label>
            Context dump
            <textarea id="uilgContext" rows="8" placeholder="Paste database export, notes, examples, rules, or content frameworks..."></textarea>
          </label>
          <div class="uilg-actions">
            <span id="uilgStatus">No context saved yet.</span>
            <button type="submit">Save context</button>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
